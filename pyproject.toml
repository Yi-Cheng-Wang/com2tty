[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "com2tty"
version = "0.3.1"
description = "A Windows COM port to WSL ttyUSB forwarder"
readme = "README.md"
authors = [
    { name = "yichengs", email = "yichengs.tw+com2tty@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "textual>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Yi-Cheng-Wang/com2tty"

[project.scripts]
com2tty = "com2tty.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"com2tty.wsl" = ["assets/*.in"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
# Correctness-focused: pyflakes plus the error-class pycodestyle checks.
# Style rules are intentionally not enforced on this codebase.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests import com2tty modules after an explicit sys.path mutation.
"tests/*" = ["E402"]
