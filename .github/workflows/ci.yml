name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest --cov=src/com2tty --cov-fail-under=100 --cov-report=term-missing tests/

  publish:
    name: Build and Publish to PyPI
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if version changed
        id: check_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Current version in pyproject.toml is $VERSION"
          
          # Query PyPI API to see if this version already exists
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/com2tty/$VERSION/json || echo "000")
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "Version $VERSION already exists on PyPI. Skipping publish."
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is new. Proceeding with publish."
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Install build tools
        if: steps.check_version.outputs.publish == 'true'
        run: python -m pip install --upgrade pip build

      - name: Build package
        if: steps.check_version.outputs.publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check_version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
